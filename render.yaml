# ============================================================================
#  Blueprint de despliegue para Render.com (plan gratis).
#  Crea: 1 base de datos PostgreSQL + API (NestJS) + Web (Next.js).
#
#  Cómo usar: en Render → New → Blueprint → conecta este repositorio.
#  Render leerá este archivo y creará los 3 servicios.
#  Después debes rellenar 3 variables (ver DEPLOYMENT.md):
#    - FIELD_ENCRYPTION_KEY (API)  → 64 caracteres hex
#    - CORS_ORIGINS (API)          → la URL pública de la web
#    - NEXT_PUBLIC_API_URL (web)   → la URL pública de la API + /api
#
#  NOTA: plan gratis = los servicios "duermen" tras inactividad (arranque
#  lento la 1ª vez) y los archivos subidos son EFÍMEROS. Solo datos de PRUEBA.
# ============================================================================

databases:
  - name: rme-db
    plan: free

services:
  # ---- API (NestJS) ----
  - type: web
    name: rme-api
    runtime: node
    plan: free
    buildCommand: npm install && npm run api:build:prod
    startCommand: npm run start:prod
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: rme-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: FIELD_ENCRYPTION_KEY
        sync: false # pega aquí un valor de 64 caracteres hex (ver DEPLOYMENT.md)
      - key: CORS_ORIGINS
        sync: false # pega aquí la URL de la web (ej. https://rme-web.onrender.com)
      - key: NODE_ENV
        value: production
      - key: STORAGE_DIR
        value: /tmp/storage

  # ---- Web (Next.js) ----
  - type: web
    name: rme-web
    runtime: node
    plan: free
    buildCommand: npm install && npm run web:build
    startCommand: npm run web:start
    envVars:
      - key: NEXT_PUBLIC_API_URL
        sync: false # pega aquí la URL de la API + /api (ej. https://rme-api.onrender.com/api)
